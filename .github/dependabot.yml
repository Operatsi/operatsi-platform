# GitHub Dependabot Configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Maintain npm dependencies for the Next.js / React platform
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    target-branch: "main"
    reviewers:
      - "bungakarunanidhi"
      - "Navyal7"
      - "krishanth7"
    assignees:
      - "krishanth7"
    labels:
      - "dependencies"
      - "javascript"
      - "automated-pr"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group dependencies into logical bundles to reduce PR noise
    groups:
      react-ecosystem:
        patterns:
          - "react*"
          - "@types/react*"
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      firebase:
        patterns:
          - "firebase*"
      devDependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    target-branch: "main"
    reviewers:
      - "bungakarunanidhi"
      - "Navyal7"
      - "krishanth7"
    assignees:
      - "krishanth7"
    labels:
      - "actions"
      - "dependencies"
      - "automated-pr"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
