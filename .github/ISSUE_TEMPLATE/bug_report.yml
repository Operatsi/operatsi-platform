name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in the OperatSI platform"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure this is not a security vulnerability. For security concerns, please refer to [SECURITY.md](https://github.com/Operatsi/operatsi-platform/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "When performing XYZ, the application crashes or displays..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the behavior."
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "A concise description of what you expected to happen."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environment Details"
      description: "Browser, Operating System, Node.js version, etc."
      placeholder: |
        - OS: Windows 11 / macOS Sonoma / Ubuntu
        - Browser: Chrome 130 / Safari 18 / Firefox
        - Device: Desktop / Mobile
    validations:
      required: false
